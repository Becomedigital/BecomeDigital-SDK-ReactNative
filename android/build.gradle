buildscript {
    ext {
        buildToolsVersion = "35.0.0"
        minSdkVersion = 24
        compileSdkVersion = 36
        targetSdkVersion = 36
        ndkVersion = "27.1.12297006"
        // Become Digital SDK requires Kotlin 2.2.10
        kotlinVersion = "2.2.10"
    }
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        // Keep AGP aligned with the version consumed by RN 0.84.x dependencies
        // to avoid AgpVersionAttr variant mismatch errors.
        classpath("com.android.tools.build:gradle:8.12.0")
        classpath("com.facebook.react:react-native-gradle-plugin")
        classpath("org.jetbrains.kotlin:kotlin-gradle-plugin:2.2.10")
        // Required for Compose with Kotlin 2.x
        classpath("org.jetbrains.kotlin:compose-compiler-gradle-plugin:2.1.20")
    }
}

apply plugin: "com.facebook.react.rootproject"

allprojects {
    repositories {
        mavenCentral()
        google()
        maven { url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
        maven { url 'https://maven.microblink.com' }
        maven { url 'https://jitpack.io' }
    }
}
