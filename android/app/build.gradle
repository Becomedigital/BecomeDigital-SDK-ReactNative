apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
// Required for Compose with Kotlin 2.x (Become Digital SDK requirement)
apply plugin: "org.jetbrains.kotlin.plugin.compose"
apply plugin: "com.facebook.react"

repositories {
    google()
    mavenCentral()
    maven { url "$rootDir/../node_modules/@react-native-async-storage/async-storage/android/local_repo" }
}/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.becomedigitalapp"

    androidResources {
        // Conserva los filtros habituales y excluye la licencia de la integración anterior.
        ignoreAssetsPatterns.addAll(["!.svn", "!.git", "!.ds_store", "!*.scc", ".*", "<dir>_*",
                                     "!CVS", "!thumbs.db", "!picasa.ini", "!*~", "com.become.mb.key"])
    }

    defaultConfig {
        applicationId "com.becomedigitalapp"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testApplicationId "com.becomedigitalapp.bridgetest"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Required: core library desugaring for Become Digital SDK
        multiDexEnabled true
    }

    compileOptions {
        // Java 17 — must match the JBR JDK configured in gradle.properties
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // Required: Enable desugaring for coreLibraryDesugaringEnabled
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        // Must match compileOptions above (JBR is Java 17)
        jvmTarget = "17"
    }

    buildFeatures {
        // Required: Compose support (mandatory for Amplify Liveness in Become SDK)
        compose true
        // Required: viewBinding
        viewBinding true
        // Required: BuildConfig generation
        buildConfig true
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Demo builds only; configure distribution signing in your own app.
            signingConfig signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            matchingFallbacks = ['release', 'debug']
        }
    }
}

dependencies {
    // ===== React Native Core =====
    implementation("com.facebook.react:react-android")
    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    // La distribución publicada incluye las dependencias nativas transitivas.
    implementation "ai.becomedigital:identity-verification:3.5.1"

    // ===== Required: Java 8+ desugaring =====
    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"

    // Utilizada directamente por el bridge para consultar el permiso de cámara.
    implementation "androidx.core:core-ktx:1.15.0"

    // ===== Tests =====
    testImplementation "junit:junit:4.13.2"
    androidTestImplementation "androidx.test.espresso:espresso-core:3.5.1"
    androidTestImplementation "androidx.test:rules:1.5.0"
    androidTestImplementation "androidx.test:runner:1.5.2"
    androidTestImplementation "androidx.test.uiautomator:uiautomator:2.3.0"
}
